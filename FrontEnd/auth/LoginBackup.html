<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Masuk | Explore Majaku</title>

    <!-- Bootstrap 5 -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link 
        rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link 
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" 
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="../CSS/auth.css">
</head>

<body>

    <!-- Header -->
    <header class="auth-header">
        <a href="../index.html" class="brand-name">
            Explore Majaku
        </a>
    </header>

    <!-- Main -->
    <main class="auth-wrapper">

        <!-- Bagian kiri -->
        <section class="auth-image-section">

            <div class="image-overlay"></div>

            <div class="image-content">
                <h1>
                    Jelajahi<br>
                    majalengka dan<br>
                    kuningan dengan<br>
                    Mudah
                </h1>

                <p>
                    Temukan Rekomendasi<br>
                    Wisata dan jadikan wisata<br>
                    favoritmu!
                </p>
            </div>

        </section>


        <!-- Bagian kanan -->
        <section class="auth-form-section">

            <div class="auth-form-container">

                <h2 class="auth-title">MASUK</h2>

                <form id="loginForm" novalidate>

                    <!-- Email / Nomor Telepon -->
                    <div class="form-group">
                        <label for="loginIdentity">
                            Email atau No telephone
                        </label>

                        <input 
                            type="text"
                            id="loginIdentity"
                            name="identity"
                            class="form-control auth-input"
                            autocomplete="username"
                            required
                        >

                        <div class="invalid-feedback">
                            Email atau nomor telephone wajib diisi.
                        </div>
                    </div>


                    <!-- Password -->
                    <div class="form-group password-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input 
                                type="password"
                                id="loginPassword"
                                name="password"
                                class="form-control auth-input"
                                autocomplete="current-password"
                                required
                            >

                            <button 
                                type="button"
                                class="password-toggle"
                                data-target="loginPassword"
                                aria-label="Tampilkan password"
                            >
                                <i class="bi bi-eye-slash"></i>
                            </button>

                        </div>

                        <div class="invalid-feedback">
                            Password wajib diisi.
                        </div>

                    </div>


                    <!-- Remember + Forgot -->
                    <div class="login-options">

                        <div class="remember-me">

                            <input 
                                type="checkbox" 
                                id="rememberMe"
                                class="form-check-input"
                            >

                            <label for="rememberMe">
                                Ingat Saya
                            </label>

                        </div>

                        <a href="#" class="forgot-password">
                            Lupa Kata sandi
                        </a>

                    </div>


                    <!-- Button Login -->
                    <button 
                        type="submit" 
                        class="btn auth-button"
                    >
                        Masuk
                    </button>

                </form>


                <!-- Divider -->
                <div class="divider">
                    <span></span>
                    <p>Atau</p>
                    <span></span>
                </div>


                <!-- Google -->
                <button 
                    type="button" 
                    class="social-button"
                    id="googleLogin"
                >
                    <span class="google-icon">G</span>
                    <span>Masuk dengan Google</span>
                </button>


                <!-- Apple -->
                <button 
                    type="button" 
                    class="social-button"
                    id="appleLogin"
                >
                    <i class="bi bi-apple apple-icon"></i>
                    <span>Masuk dengan Apple</span>
                </button>


                <!-- Register -->
                <div class="switch-auth">

                    <span>Belum punya akun?</span>

                    <a href="Register.html">
                        DAFTAR
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="../js/auth.js"></script>

</body>
</html>
