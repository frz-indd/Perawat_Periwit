        gambar_kategori: { type: string, nullable: true }
        deskripsi: { type: string, nullable: true }
        harga_tiket: { type: number, nullable: true }
        wilayah: { type: string, nullable: true }
        alamat: { type: string, nullable: true }
        jam_buka: { type: string, nullable: true }
        jam_tutup: { type: string, nullable: true }
        kategori:
