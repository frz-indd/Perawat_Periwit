$kind: http-request
method: PUT
url: '{{baseUrl}}/api/admin/change-password'
order: 5000
headers:
  Accept: application/json
  Authorization: 'Bearer {{adminJwtToken}}'
  Content-Type: application/json
body:
  type: json
  content: |-
    {"current_password": "{{adminCurrentPassword}}", "new_password": "weak"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Weak password is rejected',function(){pm.response.to.have.status(422);pm.expect(pm.response.json().status).to.eql('validation_error');});
