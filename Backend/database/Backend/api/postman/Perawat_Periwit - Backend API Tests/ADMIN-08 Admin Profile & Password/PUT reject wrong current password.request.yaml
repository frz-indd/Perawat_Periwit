$kind: http-request
method: PUT
url: '{{baseUrl}}/api/admin/change-password'
order: 4000
headers:
  Accept: application/json
  Authorization: 'Bearer {{adminJwtToken}}'
  Content-Type: application/json
body:
  type: json
  content: |-
    {"current_password": "PasswordSalah1!", "new_password": "PasswordBaru2@"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Wrong current password returns exact 400 contract',function(){pm.response.to.have.status(400);pm.expect(pm.response.json().message).to.eql('Kata sandi saat ini yang Anda masukkan salah.');});
