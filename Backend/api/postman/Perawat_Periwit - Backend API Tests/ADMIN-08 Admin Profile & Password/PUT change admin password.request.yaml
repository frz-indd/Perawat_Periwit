$kind: http-request
method: PUT
url: '{{baseUrl}}/api/admin/change-password'
order: 3000
headers:
  Accept: application/json
  Authorization: 'Bearer {{adminJwtToken}}'
  Content-Type: application/json
body:
  type: json
  content: |-
    {"current_password": "{{adminCurrentPassword}}", "new_password": "{{adminNewPassword}}"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Password updated',function(){pm.response.to.have.status(200);pm.expect(pm.response.json().message).to.eql('Kata sandi berhasil diperbarui. Silakan login kembali.');});
