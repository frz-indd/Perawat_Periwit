$kind: http-request
method: PUT
url: '{{baseUrl}}/api/admin/profile'
order: 2000
headers:
  Accept: application/json
  Authorization: 'Bearer {{adminJwtToken}}'
  Content-Type: application/json
body:
  type: json
  content: |-
    {"name": "{{adminProfileName}}", "image_url": "{{adminProfileImageUrl}}"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Profile update returns 200',function(){pm.response.to.have.status(200);pm.expect(pm.response.json().data.name).to.eql(pm.collectionVariables.get('adminProfileName'));});
