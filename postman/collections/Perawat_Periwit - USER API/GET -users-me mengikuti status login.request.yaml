$kind: http-request
name: GET /users/me mengikuti status login
url: ""
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: const auth=pm.collectionVariables.get('userAuthenticated')==='true';pm.test('Profile access matches login state',function(){pm.response.to.have.status(auth?200:401);if(auth){const d=pm.response.json().data;pm.expect(d.id_user).to.be.a('number');pm.expect(d.nama).to.be.a('string').and.not.empty;pm.expect(d.email).to.be.a('string').and.not.empty;pm.collectionVariables.set('profileName',d.nama);pm.collectionVariables.set('profileEmail',d.email);}else{pm.expect(pm.response.json().status).to.eql('unauthenticated');}});
    language: text/javascript
order: 4000
