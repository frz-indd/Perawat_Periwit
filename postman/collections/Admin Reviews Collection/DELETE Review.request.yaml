$kind: http-request
url: http://localhost:8000/api/admin_reviews.php?id={{review_id}}
method: DELETE
headers:
  Authorization: Bearer {{admin_token}}
queryParams:
  id: "{{review_id}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('DELETE berhasil', function () {
          pm.response.to.have.status(200);
          var json = pm.response.json();
          pm.expect(json.message).to.include('Ulasan berhasil dihapus dan rating destinasi diperbarui.');
      });
    language: text/javascript
order: 3000
